<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live News | Stream Overlay</title>
    <link rel="stylesheet" href="./live-news.css" />
    <script src="./live-news.js" defer></script>
  </head>
  <body>
    <aside id="ticker" hidden aria-label="Live News">
      <div class="news-bar">
        <strong id="news-label">BREAKING NEWS</strong>
        <div class="news-window">
          <div id="news-track"><span class="news-copy"></span><span class="news-copy" aria-hidden="true"></span></div>
        </div>
      </div>
      <footer><span><i></i> LIVE <b>&middot;</b> COMMUNITY NEWS</span><span>Twitch</span></footer>
    </aside>
  </body>
</html>
