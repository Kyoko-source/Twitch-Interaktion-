server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css image/svg+xml application/wasm;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  # Optional songs are mounted from the host and can be replaced without a build.
  # A missing song returns no content rather than the SPA HTML or a noisy 404.
  location ~ ^/music/nullsignal/(menu|ingame)\.mp3$ {
    try_files $uri =204;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/overlays/(live-news|shop-alert)\.(html|css|js)$ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
