[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/story/*.json"
exclude_filter="art/*,build/*,exported/*,*.md,assets/hero/inflatable-crocodile.glb,assets/creatures/aged-croc-pvc.png,assets/creatures/croc-eye.png,assets/creatures/night-crocodile.glb,assets/creatures/night-crocodile_*,assets/creatures/croc-scales-v3.png,assets/annex/clown-face.png,assets/props/kitchen-clown-v2.glb,assets/props/kitchen-clown-v2_*.jpg,assets/props/kitchen-clown-v3.glb,assets/props/kitchen-clown-v3_*.jpg"
export_path="build/windows/AfterPlay.exe"

[preset.0.options]
custom_template/release="../../tools/godot-portable/templates/windows_release_x86_64.exe"
custom_template/debug="../../tools/godot-portable/templates/windows_release_x86_64.exe"
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/icon.png"
application/product_name="After Play"
application/file_description="After Play"
application/company_name="Aviary"
application/product_version="2.2.0.0"
application/file_version="2.2.0.0"
texture_format/s3tc_bptc=true

